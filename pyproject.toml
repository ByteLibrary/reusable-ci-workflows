[project]
name = "bytelibrary-documentation"
version = "0.1.0"
description = "Validates documentation and generates the views derived from it."
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "pyyaml>=6.0.2",
    "jsonschema>=4.23.0",
    "pydantic>=2.13.5",
]

[project.scripts]
documentation = "documentation.cli:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "documentation"

# This repository holds the organization's settings; editors use them directly.
[tool.ruff]
extend = "ruff.toml"

[dependency-groups]
dev = [
    "types-jsonschema>=4.26.0.20261006",
    "types-pyyaml>=6.0.12.20260906",
]
