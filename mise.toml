# Tools for the shared Lint check, at the versions every repository is linted with, and this
# repository's own tasks.
[tools]
shellcheck = "0.11.0"
ruff = "0.16.10"
golangci-lint = "2.14.0"
python = "3.14.8"
uv = "0.12.23"

[tasks.test]
description = "Run the tests of the rules script, the lint script and the documentation generator"
run = [
  "scripts/test-standards.sh",
  "scripts/test-lint.sh",
  "uv run --frozen python -m unittest discover --start-directory tests --top-level-directory .",
]
