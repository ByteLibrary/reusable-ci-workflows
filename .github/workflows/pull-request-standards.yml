# Checks a pull request against the ways of working in the organization handbook:
# title, description, commits and wording.
name: Pull request standards

on:
  workflow_call:

permissions:
  contents: read

jobs:
  pull-request-standards:
    name: Pull request standards
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check out the rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ByteLibrary/reusable-ci-workflows
          # This repository's own pull requests test their version of the rules.
          ref: ${{ github.repository == 'ByteLibrary/reusable-ci-workflows' && github.event.pull_request.head.sha || 'main' }}
          path: .standards
          persist-credentials: false

      - name: Title is a Conventional Commit
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: .standards/scripts/standards.sh title "$TITLE"

      - name: Description follows the standard
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: .standards/scripts/standards.sh description <<<"$BODY"

      - name: Commits have no co-authors or attribution
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: git log --format='%B' "$BASE..$HEAD" | .standards/scripts/standards.sh attribution "A commit message"

      - name: No agent tool or vendor names
        env:
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
          BRANCH: ${{ github.head_ref }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          names() { .standards/scripts/standards.sh names "$1" <<<"$2" || found=1; }
          found=0
          names "The title" "$TITLE"
          names "The description" "$BODY"
          names "The branch name" "$BRANCH"
          names "A commit message" "$(git log --format='%B' "$BASE..$HEAD")"
          # The rules script is where the list of names is written down.
          names "An added line" "$(git diff "$BASE...$HEAD" -- . ':(exclude)scripts/standards.sh' | grep '^+' | grep -v '^+++' || true)"
          exit "$found"
