# Checks that documentation links resolve: relative Markdown links, frontmatter "related"
# references and llms.txt entries.
name: Documentation

on:
  workflow_call:

permissions:
  contents: read

jobs:
  documentation-links:
    name: Documentation links
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Relative links resolve
        shell: python
        run: |
          import pathlib
          import re
          import subprocess
          import sys

          files = subprocess.run(["git", "ls-files", "*.md", "llms.txt"], capture_output=True, text=True, check=True).stdout.split()
          broken = []
          for name in files:
              path = pathlib.Path(name)
              text = path.read_text(encoding="utf-8")
              targets = re.findall(r"\]\(([^)#\s]+)(?:#[^)]*)?\)", text)
              related = re.search(r"^related: \[(.*?)\]", text, re.MULTILINE)
              if related:
                  targets += [target.strip() for target in related.group(1).split(",") if target.strip()]
              for target in targets:
                  if re.match(r"^[a-z][a-z0-9+.-]*:", target):
                      continue
                  if not (path.parent / target).exists():
                      broken.append((name, target))

          for name, target in broken:
              print(f"::error file={name}::Broken link: {target}")
          sys.exit(1 if broken else 0)
